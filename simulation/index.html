<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLineup - Eğlenceli Simülasyon</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/responsive.css">
    <link rel="stylesheet" href="/src/simulation.css">
    <!-- sql.js for SQLite in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
</head>

<body>
    <!-- Animated Background -->
    <canvas id="gravity-lens-bg" class="gravity-lens-canvas"></canvas>

    <!-- Top Navbar -->
    <header class="app-header">
        <div class="header-content">
            <a href="/OpenLineup/" class="header-logo"
                style="display:flex; align-items:center; gap:8px; text-decoration:none;">
                <h1 style="margin:0; font-weight:800; letter-spacing:-0.5px;">OpenLineup</h1>
            </a>

            <!-- Nav Links -->
            <div class="header-nav" style="display:flex; gap:8px;">
                <a href="/OpenLineup/" class="save-share-btn"
                    style="padding: 6px 12px; font-size: 13px; background: transparent; color:var(--text-main); font-weight:700; border:1px solid var(--border); border-radius: 6px; text-decoration:none;">
                    <span data-i18n="navBuilder">Kadro Yapıcı</span>
                </a>
                <a href="/OpenLineup/simulation/" class="save-share-btn"
                    style="padding: 6px 12px; font-size: 13px; background: var(--accent); color:#000; font-weight:700; border:none; border-radius: 6px; text-decoration:none;">
                    <span data-i18n="funSimulation">Eğlenceli Simülasyon</span>
                </a>
            </div>

            <div class="header-actions">
                <a href="https://github.com/keyshout/OpenLineup" target="_blank" rel="noopener noreferrer"
                    class="github-star-btn">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
                        <path
                            d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.46-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
                        </path>
                    </svg>
                    <span style="font-weight:600; font-size:13px;">Star us on GitHub</span>
                </a>

                <div class="lang-selector">
                    <button class="lang-btn active" id="lang-tr">TR</button>
                    <span class="lang-divider">/</span>
                    <button class="lang-btn" id="lang-en">EN</button>
                </div>
            </div>
        </div>
    </header>

    <div class="app-wrapper">
        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Left Sidebar (Configuration) -->
            <aside class="left-sidebar">
                <div id="sim-settings" class="controls-panel"
                    style="display:flex; flex-direction:column; gap:20px; height:100%;">

                    <div style="border-bottom: 1px solid var(--border); padding-bottom: 15px;">
                        <h2
                            style="font-size:18px; color:var(--accent); font-family:'Space Grotesk', sans-serif; display:flex; align-items:center; gap:8px;">
                            <span data-i18n="simMatchSettings">Maç Ayarları</span>
                        </h2>
                    </div>

                    <!-- Team 1 Selection -->
                    <div class="settings-group">
                        <label style="font-size:14px; font-weight:600; color:var(--text-main);"
                            data-i18n="simTeam1Label">1. Takım (Ev Sahibi)</label>
                        <div class="club-search-wrapper">
                            <div class="active-club-pill hidden" id="team1-card">
                                <img id="team1-card-logo" src="" alt="Badge"
                                    style="height: 16px; width: 16px; object-fit: contain;">
                                <span id="team1-card-name"
                                    style="font-size: 11px; font-weight:600; white-space:nowrap; max-width:80px; overflow:hidden; text-overflow:ellipsis;">Club</span>
                                <svg id="clear-team1-btn" style="cursor:pointer; opacity:0.6; margin-left:4px;"
                                    width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </div>
                            <input type="text" id="team1-search" class="text-input" autocomplete="off"
                                placeholder="Ev sahibi takım ara..." data-i18n-placeholder="simSearchTeam1">
                        </div>
                        <div id="team1-results" class="search-results-dropdown hidden"></div>
                    </div>

                    <!-- Team 2 Selection -->
                    <div class="settings-group">
                        <label style="font-size:14px; font-weight:600; color:var(--text-main);"
                            data-i18n="simTeam2Label">2. Takım (Deplasman)</label>
                        <div class="club-search-wrapper">
                            <div class="active-club-pill hidden" id="team2-card">
                                <img id="team2-card-logo" src="" alt="Badge"
                                    style="height: 16px; width: 16px; object-fit: contain;">
                                <span id="team2-card-name"
                                    style="font-size: 11px; font-weight:600; white-space:nowrap; max-width:80px; overflow:hidden; text-overflow:ellipsis;">Club</span>
                                <svg id="clear-team2-btn" style="cursor:pointer; opacity:0.6; margin-left:4px;"
                                    width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </div>
                            <input type="text" id="team2-search" class="text-input" autocomplete="off"
                                placeholder="Rakip takım ara..." data-i18n-placeholder="simSearchTeam2">
                        </div>
                        <div id="team2-results" class="search-results-dropdown hidden"></div>
                    </div>

                    <div class="settings-group" style="margin-top:15px; gap:10px; display:flex; flex-direction:column;">
                        <div style="display:flex; gap:10px;">
                            <div style="flex:1;">
                                <label style="font-size:12px;" data-i18n="simPitchColor">Saha Rengi</label>
                                <input type="color" id="sim-pitch-color" value="#2d8c4e"
                                    style="width:100%; height:30px; border:none; border-radius:4px; cursor:pointer; padding:0;">
                            </div>
                            <div style="flex:1;">
                                <label style="font-size:12px;" data-i18n="simGoalColor">Kale Rengi</label>
                                <input type="color" id="sim-goal-color" value="#ffffff"
                                    style="width:100%; height:30px; border:none; border-radius:4px; cursor:pointer; padding:0;">
                            </div>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <div style="flex:1;">
                                <label style="font-size:12px;" data-i18n="simTeam1Color">1. Takım Rengi</label>
                                <input type="color" id="sim-team1-color" value="#ffffff"
                                    style="width:100%; height:30px; border:none; border-radius:4px; cursor:pointer; padding:0;">
                            </div>
                            <div style="flex:1;">
                                <label style="font-size:12px;" data-i18n="simTeam2Color">2. Takım Rengi</label>
                                <input type="color" id="sim-team2-color" value="#ffffff"
                                    style="width:100%; height:30px; border:none; border-radius:4px; cursor:pointer; padding:0;">
                            </div>
                        </div>
                        <div>
                            <label data-i18n="simMatchDuration">Maç Süresi</label>
                            <select id="sim-duration" class="text-input" style="cursor:pointer; width:100%;">
                                <option value="15" data-i18n="simDuration15">15 Saniye</option>
                                <option value="30" selected data-i18n="simDuration30">30 Saniye</option>
                                <option value="60" data-i18n="simDuration60">60 Saniye</option>
                            </select>
                        </div>
                    </div>

                    <button id="btn-start-match" class="save-share-btn"
                        style="width:100%; padding:15px; font-size:16px; background:var(--accent); color:#000; font-weight:800; border:none; border-radius:8px; cursor:pointer;"
                        disabled>
                        <span data-i18n="simStartMatch">MAÇA BAŞLA</span>
                    </button>
                </div>

                <!-- ===== WINNER PANELİ (maç bitince görünecek) ===== -->
                <div id="sim-winner-panel" class="controls-panel"
                    style="display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; height:100%; text-align:center; padding:20px;">
                    <p
                        style="font-size:13px; color:var(--text-dim); margin:0; letter-spacing:2px; text-transform:uppercase;">
                        ⚽ Maç Bitti</p>
                    <h2 id="panel-winner-text"
                        style="font-size:22px; color:var(--accent); margin:0; font-family:'Space Grotesk', sans-serif; font-weight:700;">
                    </h2>
                    <p id="panel-score-text"
                        style="font-size:42px; font-weight:bold; margin:0; color:#fff; font-family:'Space Grotesk', sans-serif;">
                    </p>

                    <div style="display:flex; flex-direction:column; gap:10px; width:100%; margin-top:10px;">
                        <button id="btn-download-video" class="save-share-btn"
                            style="background:#ea4335; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; font-size:15px; width:100%; cursor:pointer;">
                            📹 <span data-i18n="simDownloadVideo">Videoyu İndir</span>
                        </button>
                        <button id="btn-share-x" class="save-share-btn"
                            style="background:#000; color:white; border:1px solid #333; padding:12px; border-radius:8px; font-weight:bold; font-size:15px; width:100%; cursor:pointer;">
                            <span data-i18n="simShareX">𝕏'te Paylaş</span>
                        </button>
                        <button id="btn-restart" class="save-share-btn"
                            style="background:transparent; color:var(--text-main); border:1px solid var(--border); padding:12px; border-radius:8px; font-weight:bold; font-size:15px; width:100%; cursor:pointer;">
                            🔄 <span data-i18n="simPlayAgain">Tekrar Oyna</span>
                        </button>
                    </div>
                </div>

            </aside>

            <!-- Right Main Content (Pitch) -->
            <section class="right-content simulation-content"
                style="display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;">

                <!-- Scoreboard Header -->
                <header class="sim-header"
                    style="position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:20;">
                    <div class="sim-team team1">
                        <img id="team1-logo" src="" alt="Team 1" style="opacity:0.2;">
                        <span id="team1-name">Ev Sahibi</span>
                    </div>

                    <div class="sim-score-board">
                        <div class="sim-score">
                            <span id="score1">0</span>
                            <span class="score-divider">-</span>
                            <span id="score2">0</span>
                        </div>
                        <div class="sim-time" id="sim-timer">00:00</div>
                    </div>

                    <div class="sim-team team2">
                        <span id="team2-name">Deplasman</span>
                        <img id="team2-logo" src="" alt="Team 2" style="opacity:0.2;">
                    </div>
                </header>

                <!-- Canvas Pitch -->
                <div class="pitch-card"
                    style="background:transparent; border:none; box-shadow:none; overflow:visible; width:100%; display:flex; justify-content:center;">
                    <div class="canvas-container"
                        style="border-radius:50%; box-shadow:0 0 50px rgba(0,0,0,0.5); background:#111; overflow:hidden;">
                        <canvas id="sim-canvas" width="1080" height="1080"
                            style="display:block; width:100%; height:100%; object-fit:contain;"></canvas>
                    </div>
                </div>



            </section>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-content">
            <div class="footer-left">
                <strong>OpenLineup</strong> &copy; 2026
                <span class="footer-divider">•</span>
                Open Source Football Formation Builder
            </div>
            <div class="footer-right">
                Released under the
                <a href="https://opensource.org/licenses/MIT" target="_blank"
                    style="color:var(--accent); text-decoration:none;">MIT License</a>
                <span class="footer-divider">•</span>
                Built with <a href="https://vitejs.dev" target="_blank"
                    style="color:#fff; text-decoration:underline;">Vite</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/simulation.js"></script>
</body>

</html>
